# Sinh tự động bởi theme-render.py — đừng sửa tay. eza tự đọc ~/.config/eza/theme.yml
colourful: true

filekinds:
  normal: {foreground: "{{fg}}"}
  directory: {foreground: "{{accent}}", is_bold: true}
  symlink: {foreground: "{{cyan}}"}
  pipe: {foreground: "{{orange}}"}
  block_device: {foreground: "{{red}}"}
  char_device: {foreground: "{{orange}}"}
  socket: {foreground: "{{red}}"}
  special: {foreground: "{{accent2}}"}
  executable: {foreground: "{{green}}", is_bold: true}
  mount_point: {foreground: "{{accent}}", is_bold: true, is_underline: true}

perms:
  user_read: {foreground: "{{yellow}}"}
  user_write: {foreground: "{{red}}"}
  user_execute_file: {foreground: "{{green}}", is_bold: true}
  user_execute_other: {foreground: "{{green}}", is_bold: true}
  group_read: {foreground: "{{yellow}}"}
  group_write: {foreground: "{{red}}"}
  group_execute: {foreground: "{{green}}"}
  other_read: {foreground: "{{yellow}}"}
  other_write: {foreground: "{{red}}"}
  other_execute: {foreground: "{{green}}"}
  special_user_file: {foreground: "{{accent2}}"}
  special_other: {foreground: "{{accent2}}"}
  attribute: {foreground: "{{fg_dim}}"}

size:
  major: {foreground: "{{fg_dim}}"}
  minor: {foreground: "{{cyan}}"}
  number_byte: {foreground: "{{fg}}"}
  number_kilo: {foreground: "{{fg}}"}
  number_mega: {foreground: "{{cyan}}"}
  number_giga: {foreground: "{{accent2}}"}
  number_huge: {foreground: "{{accent2}}"}
  unit_byte: {foreground: "{{muted}}"}
  unit_kilo: {foreground: "{{muted}}"}
  unit_mega: {foreground: "{{muted}}"}
  unit_giga: {foreground: "{{muted}}"}
  unit_huge: {foreground: "{{muted}}"}

users:
  user_you: {foreground: "{{accent}}"}
  user_root: {foreground: "{{red}}"}
  user_other: {foreground: "{{accent2}}"}
  group_yours: {foreground: "{{accent}}"}
  group_other: {foreground: "{{muted}}"}
  group_root: {foreground: "{{red}}"}

links:
  normal: {foreground: "{{cyan}}"}
  multi_link_file: {foreground: "{{orange}}"}

git:
  new: {foreground: "{{green}}"}
  modified: {foreground: "{{yellow}}"}
  deleted: {foreground: "{{red}}"}
  renamed: {foreground: "{{cyan}}"}
  typechange: {foreground: "{{accent2}}"}
  ignored: {foreground: "{{muted}}"}
  conflicted: {foreground: "{{red}}", is_bold: true}

git_repo:
  branch_main: {foreground: "{{accent2}}"}
  branch_other: {foreground: "{{orange}}"}
  git_clean: {foreground: "{{green}}"}
  git_dirty: {foreground: "{{yellow}}"}

file_type:
  image: {foreground: "{{accent2}}"}
  video: {foreground: "{{accent2}}", is_bold: true}
  music: {foreground: "{{cyan}}"}
  lossless: {foreground: "{{cyan}}", is_bold: true}
  crypto: {foreground: "{{red}}"}
  document: {foreground: "{{fg_dim}}"}
  compressed: {foreground: "{{orange}}"}
  temp: {foreground: "{{muted}}"}
  compiled: {foreground: "{{green}}"}
  build: {foreground: "{{yellow}}", is_bold: true}
  source: {foreground: "{{accent}}"}

punctuation: {foreground: "{{muted}}"}
date: {foreground: "{{fg_dim}}"}
inode: {foreground: "{{muted}}"}
blocks: {foreground: "{{muted}}"}
header: {foreground: "{{fg_dim}}", is_underline: true}
octal: {foreground: "{{accent2}}"}
flags: {foreground: "{{accent2}}"}
symlink_path: {foreground: "{{cyan}}"}
control_char: {foreground: "{{red}}"}
broken_symlink: {foreground: "{{red}}"}
broken_path_overlay: {foreground: "{{red}}", is_underline: true}
