# Sinh tự động bởi theme-render.py — đừng sửa tay. Nguồn: ~/.config/theme/templates/dunst.conf
# Drop-in ghi đè màu trong dunstrc (alpha e6 để Hyprland blur phía sau)

[urgency_low]
    background = "{{bg}}e6"
    foreground = "{{fg_dim}}"
    frame_color = "{{surface}}"
    highlight = "{{accent}}"

[urgency_normal]
    background = "{{bg}}e6"
    foreground = "{{fg}}"
    frame_color = "{{accent}}"
    highlight = "{{accent}}"

[urgency_critical]
    background = "{{bg}}e6"
    foreground = "{{fg}}"
    frame_color = "{{red}}"
    highlight = "{{red}}"

[osd]
    appname = OSD
    frame_color = "{{surface}}"
