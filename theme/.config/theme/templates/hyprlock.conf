# Sinh tự động bởi theme-render.py — đừng sửa tay. Nguồn: ~/.config/theme/templates/hyprlock.conf
$bg       = rgb({{bg.hex}})
$fg       = rgb({{fg.hex}})
$muted    = rgb({{muted.hex}})
$accent   = rgb({{accent.hex}})
$yellow   = rgb({{yellow.hex}})
$overlay  = rgba({{bg.hex}}73)
$inner    = rgba({{bg.hex}}99)
$gradient = rgba({{accent.hex}}ee) rgba({{accent2.hex}}ee) 45deg
$checking = rgba({{yellow.hex}}ee) rgba({{orange.hex}}ee) 45deg
$failed   = rgba({{red.hex}}ee) rgba({{accent2.hex}}ee) 45deg
