# hyprlock — màu từ colors-hyprlock.conf (theme-render.py), cùng bảng màu với waybar/dunst/rofi
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
#
# Nền là wallpaper đang dùng (~/.cache/current-wallpaper, do scripts/set-wallpaper.sh ghi lại)
# Ảnh đại diện: ~/.face
# Lưu ý: trong hyprlang `#` là comment → màu trong markup phải viết `##`
#
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace

source = ~/.config/hypr/colors-hyprlock.conf # $bg $fg $muted $accent $yellow $overlay $inner $gradient $checking $failed

$font  = Inter Display
$mono  = JetBrainsMono Nerd Font
$info  = ~/.config/hypr/scripts/lock-info.sh

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 2000
}

# Cùng nhịp với Hyprland/waybar: easeOutQuint
animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 3, easeOutQuint
    animation = fadeOut, 1, 2, easeOutQuint
    animation = inputFieldDots, 1, 1.5, easeOutQuint
    animation = inputFieldColors, 1, 3, easeOutQuint
    animation = inputFieldWidth, 1, 3, easeOutQuint
    animation = inputFieldFade, 1, 3, easeOutQuint
}

background {
    monitor =
    path = ~/.cache/current-wallpaper
    color = $bg # fallback khi thiếu ảnh
    blur_passes = 3
    blur_size = 8
    brightness = 0.75
    contrast = 0.9
    vibrancy = 0.2
    noise = 0.012
}

# Phủ một lớp TokyoNight để chữ đọc được trên cả wallpaper sáng (chainsaw-man)
shape {
    monitor =
    size = 100%, 100%
    color = $overlay
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
}

# ---- Đồng hồ: điểm nhấn duy nhất — giờ đậm, phút mảnh ----

label {
    monitor =
    text = cmd[update:1000] echo "<span font_weight='900'>$(date +%H)</span>"
    color = $fg
    font_size = 190
    font_family = $font
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.35)
    position = 0, 318
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "<span font_weight='100'>$(date +%M)</span>"
    color = $accent
    font_size = 190
    font_family = $font
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.35)
    position = 0, 110
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $fg
    font_size = 20
    font_family = $font
    position = 0, -35
    halign = center
    valign = center
}

# ---- Người dùng ----

image {
    monitor =
    path = ~/.face
    size = 96
    rounding = -1
    border_size = 2
    border_color = $gradient
    position = 0, -140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] $info greeting
    color = $fg
    font_size = 15
    font_family = $font
    position = 0, -225
    halign = center
    valign = center
}

# Cùng gradient xanh → tím với viền cửa sổ Hyprland
input-field {
    monitor =
    size = 300, 48
    rounding = -1
    outline_thickness = 2
    outer_color = $gradient
    inner_color = $inner
    font_color = $fg
    font_family = $mono
    check_color = $checking
    fail_color = $failed
    capslock_color = $yellow
    fade_on_empty = false
    placeholder_text = <i>Nhập mật khẩu</i>
    fail_text = $FAIL <b>($ATTEMPTS)</b>
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    hide_input = false
    position = 0, -295
    halign = center
    valign = center
}

# ---- Thông tin phụ: nhỏ, ở góc ----

label {
    monitor =
    text = cmd[update:30000] $info status
    color = $fg
    font_size = 13
    font_family = $mono
    position = 40, 30
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:900000] $info weather
    color = $fg
    font_size = 13
    font_family = $mono
    position = -40, -30
    halign = right
    valign = top
}
