general {
    lock_cmd = pidof hyprlock || hyprlock                                            # tránh chạy 2 instance
    before_sleep_cmd = loginctl lock-session                                         # khóa trước khi suspend (gập máy)
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'           # bật màn khi thức dậy
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330                                                                                  # 5.5min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'                            # screen off when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'                              # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 1800                                # 30min
    on-timeout = systemctl suspend                # suspend pc
}