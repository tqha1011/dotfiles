# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'
palette = "tokyonight_night"

# Inserts a blank line between shell prompts
add_newline = true

format = """
[╭─](bold green)$directory$git_branch$git_status$os$nodejs$python$docker_context$dotnet$lua
[╰─](bold green)$character"""

right_format = '$username$hostname$cmd_duration$memory_usage'

[fill]
symbol = " "

[character]
success_symbol = '[➜](bold green)'
error_symbol = '[✗](bold red)'

[directory]
style = 'bold sapphire'
truncation_length = 20
truncate_to_repo = true
format = '[ $path]($style)[$read_only]($read_only_style)'

[git_branch]
symbol = '🌱 '
truncation_length = 20
truncation_symbol = ''
style = 'bold lavender'
format = '[ $symbol$branch]($style)'

[git_status]
format = "[$untracked$staged$modified$renamed$conflicted$ahead_behind ]($style)"
# options available for format
staged     = "[+$count](green)"
modified   = "[!$count](yellow)"
renamed    = "[»](blue)"
deleted    = "[-${count}](red)"
untracked  = "[?${count}](red)"
stashed    = "[≡](lavender)"
conflicted = "[✖](red bold)"

ahead      = "[⇡${count}](teal)"
behind     = "[⇣${count}](peach)"
diverged   = "[⇕⇡${ahead_count}⇣${behind_count}](mauve)"

[os]
disabled = false
style = 'bold overlay2'
format = '[ $symbol]($style)'

[os.symbols]
Arch = '󰣇'
EndeavourOS = ''

[nodejs]
symbol = ''
style = 'bold green'
format = '[ $symbol$version]($style)'

[python]
symbol = ' '
style = 'bold yellow'
format = '[ $symbol$version]($style)'

[docker_context]
symbol = ' '
style = 'bold blue'
format = '[ $symbol$context]($style)'

[dotnet]
symbol = '🥅 '
style = 'bold mauve'
heuristic = false
format = '[ $symbol$version]($style)'

[lua]
symbol = '🌕 '
style = 'bold peach'
format = '[ $symbol$version]($style)'

[cmd_duration]
min_time = 100
style = 'fg:overlay1'
format = '[$duration]($style) '

[username]
show_always = false
style_user = 'bold dimmed overlay2'
format = '[$user]($style)'

[hostname]
ssh_only = true
style = 'bold dimmed overlay2'
format = '[@$hostname]($style) '

# ~/.config/starship.toml

[memory_usage]
disabled = false
threshold = -1
symbol = ' '
style = 'bold dimmed teal'


